[package]
name = "melin-bench"
version.workspace = true
edition = "2024"
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Benchmark suite for the Melin exchange"
default-run = "melin-bench"

[features]
## Default mirrors `melin-server`'s default set so plain `cargo run -p
## melin-bench` behaves like a stock server build. Disable individual
## features with `--no-default-features --features=...` to benchmark
## without hash-chain or release-tracing.
default = ["hash-chain", "release-tracing"]
## The `melin-server/...` entries below are redundant today: `melin-server`
## is taken with `default-features = false` and its own `hash-chain` /
## `release-tracing` features only forward to the same leaf crates already
## listed here. They are forwarded anyway so that the day someone gates
## server code on one of these directly, bench builds pick it up instead of
## silently measuring a server built without it.
hash-chain = [
    "melin-journal/hash-chain",
    "melin-transport-core/hash-chain",
    "melin-server-runtime/hash-chain",
    "melin-server/hash-chain",
]
release-tracing = [
    "tracing/max_level_info",
    "melin-server-runtime/release-tracing",
    "melin-server/release-tracing",
]
skip-order-exec = [
    "melin-exchange-core/skip-order-exec",
    "melin-server/skip-order-exec",
    "hash-chain",
    "release-tracing",
]
no-persist = ["melin-transport-core/no-persist", "melin-server-runtime/no-persist"]
latency-trace = [
    "melin-transport-core/latency-trace",
    "melin-server-runtime/latency-trace",
    "melin-server/latency-trace",
]
tick-to-trade = ["latency-trace", "melin-server-runtime/tick-to-trade"]
## Kept for backward compatibility — io_uring is now always used.
io-uring = []
## DPDK userspace TCP transport. Implies `release-tracing` to match the
## production-style binary the DPDK rig benches against. Add
## `--features=hash-chain` separately if you want to measure with the
## journal hash chain on; add `skip-order-exec` to bench transport-only.
dpdk = [
    "dep:melin-dpdk",
    "melin-dpdk/dpdk-sys",
    "dep:smoltcp",
    "release-tracing",
]
pipeline-stats = [
    "melin-transport-core/pipeline-stats",
    "melin-server-runtime/pipeline-stats",
]
plot = ["dep:plotters"]

[lib]
name = "melin_bench"
path = "src/lib.rs"

[[bin]]
name = "melin-bench"
path = "src/main.rs"

[[bin]]
name = "melin-plot"
path = "src/plot.rs"
required-features = ["plot"]

[[bin]]
name = "journal_writer_bench"
path = "src/journal_writer_bench.rs"

[dependencies]
# Transport-agnostic half of the bench: clock, phases, pacing, time
# series, key derivation, health/stats scrapers. Knows nothing about
# orders — everything exchange-shaped stays in this crate.
melin-bench-harness = { workspace = true }
melin-exchange-core = { workspace = true }
melin-trading = { workspace = true }
melin-types = { workspace = true }
melin-journal = { workspace = true }
melin-pipeline = { workspace = true }
melin-protocol = { workspace = true }
melin-wire-protocol = { workspace = true }
melin-server-runtime = { workspace = true }
# Inherits `default-features = false` from the workspace — this crate
# re-declares the server's feature set (see [features] above) and enables the
# pieces it wants explicitly, so the bench build matches the flags it measures.
melin-server = { workspace = true }
melin-app = { workspace = true }
melin-transport-core = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
getrandom = "0.4"
hdrhistogram = "7"
humantime = { workspace = true }
rand = "0.10"
libc = { workspace = true }
tikv-jemallocator = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
io-uring = "0.7"
melin-dpdk = { workspace = true, optional = true }
smoltcp = { package = "fastcp", version = "0.13", default-features = false, features = ["std", "medium-ethernet", "proto-ipv4", "socket-tcp"], optional = true }
ratatui = { version = "0.30", optional = true }
crossterm = { version = "0.29", optional = true }
plotters = { version = "0.3", optional = true, default-features = false, features = ["svg_backend", "bitmap_backend", "bitmap_encoder", "ttf", "line_series"] }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
# Streaming gzip decode for ITCH 5.0 dumps. flate2 with the default
# `miniz_oxide` backend keeps the dep tree pure-Rust; we don't need
# zlib-ng-level throughput because the bottleneck is the parser, not
# decompression.
flate2 = "1"
