[package]
name = "melin-ec-protocol"
version.workspace = true
edition = "2024"
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Binary wire protocol with typed request/response enums for the Melin exchange"

[dependencies]
# Typed views over raw byte buffers for the wire frame header —
# replaces hand-rolled le::put / le::get pairs. derive feature for
# `FromBytes` / `IntoBytes`.
zerocopy = { version = "0.8", features = ["derive"] }
# The exchange's roles implement the sequencer's `Role` trait, and the
# access rule takes the `ClientRole` the node hands its decoder. Light:
# melin-app pulls in base64, libc and tracing only.
melin-app = { workspace = true }
melin-ec-types = { workspace = true }
melin-wire-protocol = { workspace = true }

[dev-dependencies]
bolero = "0.13"
