[package]
name = "melin-ec-oe-gateway"
version.workspace = true
edition = "2024"
license-file.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "FIX 4.4 order entry gateway for the Melin exchange"

[[bin]]
name = "melin-ec-oe-gateway"
path = "src/main.rs"

[dependencies]
melin-client = { workspace = true }
melin-ec-gateway-core = { workspace = true }
melin-ec-protocol = { workspace = true }
melin-ec = { workspace = true }
melin-ec-types = { workspace = true }
ed25519-dalek = { workspace = true }
toml = "1"
serde = { version = "1", features = ["derive"] }
io-uring = "0.7"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
libc = { workspace = true }

[dev-dependencies]
proptest = "1"
