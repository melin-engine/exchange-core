[workspace]
# Explicit subtree rather than `crates/*/*`: leftover ignored files from
# other branches (e.g. artifacts under crates/core on the sequencer branch)
# can leave stray directories under crates/ that a bare glob would pick up.
members = ["crates/exchange/*"]
resolver = "3"

[workspace.package]
license-file = "LICENSE"
repository = "https://github.com/melin-engine/exchange-core"
homepage = "https://github.com/melin-engine/exchange-core"
authors = ["P.L.S.C."]

[workspace.dependencies]
base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
humantime = "2"
libc = "0.2"
rand = "0.10"
tikv-jemallocator = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
# Full cross-crate LTO: allows LLVM to inline across crate boundaries
# (e.g., disruptor ring ops into engine hot path). Major win for multi-crate
# workspaces. Cost: slower release builds.
lto = "fat"
# Single codegen unit: LLVM optimizes the entire crate as one compilation
# unit instead of splitting into parallel chunks. Pairs with LTO for
# maximum cross-function optimization.
codegen-units = 1
# Abort on panic: eliminates unwind tables and landing pads. Smaller
# binaries, no unwind overhead at call boundaries. Safe here because
# pipeline threads don't use catch_unwind.
panic = "abort"

# Compile dependencies with optimizations even in debug mode. Makes
# `cargo test` (especially proptests) run much faster without slowing
# down the edit-compile-debug cycle for our own code.
[profile.dev.package."*"]
opt-level = 2

# BENCHMARK BRANCH ONLY — do not merge into main.
#
# Redirects every sequencer crate from the published 0.13.0 releases to the
# `feat/journal-async-flush` branch of the sequencer repository. All eight
# crates move together: mixing a patched crate with published siblings
# would link two copies of the same types. Note this list includes
# `melin-raft`, which earlier bench branches deliberately omitted — it was
# unpublished then and resolved within the git source. It ships on
# crates.io as of 0.13.0, so leaving it unpatched would now pull a
# published raft against patched siblings.
#
# HTTPS rather than SSH so bench hosts need no deploy key. The exact commit
# is pinned in `Cargo.lock`; run `cargo update -p melin-app` (or any of
# them) to pick up new commits on the branch.
[patch.crates-io]
melin-app = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-dpdk = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-journal = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-pipeline = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-raft = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-server-runtime = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-transport-core = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }
melin-wire-protocol = { git = "https://github.com/melin-engine/melin", branch = "feat/journal-async-flush" }

