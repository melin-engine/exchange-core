[workspace]
# Explicit subtree rather than `crates/*/*`: leftover ignored files from
# other branches (e.g. artifacts under crates/core on the sequencer branch)
# can leave stray directories under crates/ that a bare glob would pick up.
members = ["crates/exchange/*"]
resolver = "3"

[workspace.package]
# Single source of truth for the release version — every member inherits it
# via `version.workspace = true`. Bumping a release means editing this line
# plus the exchange-crate pins in `[workspace.dependencies]` below, all in
# this file. Keep the two in lockstep: a member's inherited version and the
# version requirement its dependents resolve against must always match.
version = "0.13.0"
license-file = "LICENSE"
repository = "https://github.com/melin-engine/exchange-core"
homepage = "https://github.com/melin-engine/exchange-core"
authors = ["P.L.S.C."]

[workspace.dependencies]
# Intra-workspace crates. `path` is resolved from the workspace root (not
# the member), and `version` is what dependents get on crates.io — path is
# used for local builds, the version requirement for published ones. Both
# must be carried here so `cargo publish` accepts the member manifests.
#
# Only crates that something else depends on are listed. The leaf binaries
# (melin-admin, melin-bench, the two gateways, the two TUIs) inherit the
# workspace version but are nobody's dependency, so they need no pin.
melin-client = { path = "crates/exchange/client", version = "0.13.0" }
melin-exchange-core = { path = "crates/exchange/exchange-core", version = "0.13.0" }
melin-gateway-core = { path = "crates/exchange/gateway-core", version = "0.13.0" }
melin-market-data = { path = "crates/exchange/market-data", version = "0.13.0" }
melin-protocol = { path = "crates/exchange/protocol", version = "0.13.0" }
# `default-features = false` lives here rather than on the consumer: a member
# cannot override an inherited `default-features`, and melin-bench — the only
# crate that depends on the server — re-declares the server's feature set and
# enables the pieces it wants explicitly. A future consumer that does want the
# stock build must ask for `features = ["hash-chain", "release-tracing"]`.
melin-server = { path = "crates/exchange/server", version = "0.13.0", default-features = false }
melin-trading = { path = "crates/exchange/trading", version = "0.13.0" }
melin-types = { path = "crates/exchange/types", version = "0.13.0" }

# Melin sequencer crates, released from the separate sequencer repository.
# Kept as a group distinct from the exchange crates above: the sequencer
# moves on its own schedule and the two version numbers only happen to
# coincide today. All seven must be pointed at the same source together —
# a straggler mixes journal/wire formats across the pipeline rather than
# just looking untidy.
#
# TEMPORARILY pinned to the `feat/dpdk-peer-mac` branch instead of the
# crates.io 0.14.0 release, to pick up the replica-side peer-MAC work that
# unblocks replicated DPDK on mlx5 ports. Revert every one of these to
# `"<version>"` once that lands in a release — a git dependency does not
# participate in semver resolution, so leaving it here silently freezes
# the sequencer at one branch commit.
#
# https, not ssh: bench hosts are provisioned with an authorized_keys file
# and no private key of their own, so an `ssh://` remote fails their build
# at fetch time with "Host key verification failed" and no amount of cargo
# configuration helps. Anonymous https read works from a bare host, which
# is also how the hosts clone this repo.
melin-app = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-dpdk = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-journal = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-pipeline = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-server-runtime = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-transport-core = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }
melin-wire-protocol = { git = "https://github.com/melin-engine/melin.git", branch = "feat/dpdk-peer-mac" }

base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
humantime = "2"
libc = "0.2"
rand = "0.10"
tikv-jemallocator = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

# TEMPORARY, paired with the git-pinned melin crates above.
#
# The `feat/dpdk-peer-mac` branch takes `fastcp` from git rather than
# crates.io. Our bench takes it from crates.io. Cargo treats one crate
# from two sources as two unrelated crates even at the identical version,
# so `fastcp::phy::Device` from the registry copy does not satisfy the
# bound on the git copy's `Interface::poll` — the build fails with a
# trait mismatch that names the same trait twice. Patching the registry
# source to the branch melin uses collapses them back into one crate.
#
# Remove together with the git pins above when the sequencer work lands
# in a release, so the release's own fastcp requirement governs again.
[patch.crates-io]
fastcp = { git = "https://github.com/melin-engine/fastcp.git", branch = "feat/zc-rx-window-and-index-eviction" }

[profile.release]
# Full cross-crate LTO: allows LLVM to inline across crate boundaries
# (e.g., disruptor ring ops into engine hot path). Major win for multi-crate
# workspaces. Cost: slower release builds.
lto = "fat"
# Single codegen unit: LLVM optimizes the entire crate as one compilation
# unit instead of splitting into parallel chunks. Pairs with LTO for
# maximum cross-function optimization.
codegen-units = 1
# Abort on panic: eliminates unwind tables and landing pads. Smaller
# binaries, no unwind overhead at call boundaries. Safe here because
# pipeline threads don't use catch_unwind.
panic = "abort"

# Compile dependencies with optimizations even in debug mode. Makes
# `cargo test` (especially proptests) run much faster without slowing
# down the edit-compile-debug cycle for our own code.
[profile.dev.package."*"]
opt-level = 2

