[workspace]
# Explicit subtree rather than `crates/*/*`: leftover ignored files from
# other branches (e.g. artifacts under crates/core on the sequencer branch)
# can leave stray directories under crates/ that a bare glob would pick up.
members = ["crates/exchange/*"]
resolver = "3"

[workspace.package]
# Single source of truth for the release version — every member inherits it
# via `version.workspace = true`. Bumping a release means editing this line
# plus the exchange-crate pins in `[workspace.dependencies]` below, all in
# this file. Keep the two in lockstep: a member's inherited version and the
# version requirement its dependents resolve against must always match.
version = "0.16.0"
license-file = "LICENSE"
repository = "https://github.com/melin-engine/exchange-core"
homepage = "https://github.com/melin-engine/exchange-core"
authors = ["P.L.S.C."]

[workspace.dependencies]
# Intra-workspace crates. `path` is resolved from the workspace root (not
# the member), and `version` is what dependents get on crates.io — path is
# used for local builds, the version requirement for published ones. Both
# must be carried here so `cargo publish` accepts the member manifests.
#
# Every exchange-core crate is `melin-ec-…` ("ec" for exchange core), and
# the matching engine itself is `melin-ec`. Bare `melin-…` names belong to
# the sequencer's crates, so the two families can never collide on
# crates.io. The binaries carry the prefix too (`melin-ec-server`,
# `melin-ec-admin`, …), so one name means one thing everywhere.
#
# Only crates that something else depends on are listed. The leaf binaries
# (melin-ec-admin, melin-ec-bench, the two gateways, the two TUIs) inherit
# the workspace version but are nobody's dependency, so they need no pin.
melin-ec = { path = "crates/exchange/exchange-core", version = "0.16.0" }
melin-ec-client = { path = "crates/exchange/client", version = "0.16.0" }
melin-ec-gateway-core = { path = "crates/exchange/gateway-core", version = "0.16.0" }
melin-ec-market-data = { path = "crates/exchange/market-data", version = "0.16.0" }
melin-ec-protocol = { path = "crates/exchange/protocol", version = "0.16.0" }
# `default-features = false` lives here rather than on the consumer: a member
# cannot override an inherited `default-features`, and melin-ec-bench — the
# only crate that depends on the server — re-declares the server's feature
# set and enables the pieces it wants explicitly. A future consumer that does
# want the stock build must ask for `features = ["hash-chain", "release-tracing"]`.
melin-ec-server = { path = "crates/exchange/server", version = "0.16.0", default-features = false }
melin-ec-trading = { path = "crates/exchange/trading", version = "0.16.0" }
melin-ec-types = { path = "crates/exchange/types", version = "0.16.0" }

# Melin sequencer crates, consumed from crates.io and released from the
# separate sequencer repository. Kept as a group distinct from the exchange
# crates above: the sequencer moves on its own schedule and the two version
# numbers need not coincide. All eight must be bumped together — a straggler
# mixes journal/wire formats across the pipeline rather than just looking
# untidy.
#
# Temporarily pinned to commits on the sequencer's `main` branch to adopt
# the upcoming release ahead of time, one upstream change at a time; switch
# back to a crates.io version once it is published.
melin-app = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
# The node's own wire-protocol client: framing, the Ed25519 handshake and
# the reply batch. Every tool here that talks to a node authenticates
# through it rather than re-rolling the handshake.
melin-client = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-dpdk = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-journal = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-pipeline = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-server-runtime = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-transport-core = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }
melin-wire-protocol = { git = "https://github.com/melin-engine/melin.git", rev = "5af489d0216a0c6a1f1acdaf561e82a4e8bf221f" }

base64 = "0.22"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
humantime = "2"
libc = "0.2"
rand = "0.10"
tikv-jemallocator = "0.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[profile.release]
# Full cross-crate LTO: allows LLVM to inline across crate boundaries
# (e.g., disruptor ring ops into engine hot path). Major win for multi-crate
# workspaces. Cost: slower release builds.
lto = "fat"
# Single codegen unit: LLVM optimizes the entire crate as one compilation
# unit instead of splitting into parallel chunks. Pairs with LTO for
# maximum cross-function optimization.
codegen-units = 1
# Abort on panic: eliminates unwind tables and landing pads. Smaller
# binaries, no unwind overhead at call boundaries. Safe here because
# pipeline threads don't use catch_unwind.
panic = "abort"

# Compile dependencies with optimizations even in debug mode. Makes
# `cargo test` (especially proptests) run much faster without slowing
# down the edit-compile-debug cycle for our own code.
[profile.dev.package."*"]
opt-level = 2

